# fringe-cli for Linux (x86_64, aarch64) and Windows (x86_64): build and test on every
# pull request and push to main; when a release is published, attach the archives to it
# and add their checksums to its SHA256SUMS. macOS builds stay local (scripts/release.sh),
# since they are signed and notarized.
#
# The release trigger is `release: published`, not a tag push: scripts/release.sh has
# you push the tag and then `gh release create`, so the release exists by the time this
# runs. Re-running the workflow for a release replaces its Linux and Windows assets.
name: CLI (Linux, Windows)

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) rather than ubuntu-latest, so the binaries run on
          # older distributions too (Debian 12, Ubuntu 22.04).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz, python: python3 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz, python: python3 }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, archive: zip, python: python }
    defaults:
      run:
        shell: bash
    steps:
      # The Windows image checks out with CRLF line endings by default; keep the
      # repository's LF so puzzles, fixtures and the header copies match byte for byte.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          rustc --version

      # As scripts/build.sh does for a release: keep the runner's paths out of the
      # binary. Windows links the C runtime statically, so the .exe needs no
      # Visual C++ redistributable. Set for the tests too, so they test what ships.
      - name: Release flags
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
              cargo_home="$(cygpath -w "${CARGO_HOME:-$USERPROFILE/.cargo}")"
              root="$(cygpath -w "$GITHUB_WORKSPACE")"
              extra="-C target-feature=+crt-static"
          else
              cargo_home="${CARGO_HOME:-$HOME/.cargo}"
              root="$GITHUB_WORKSPACE"
              extra=""
          fi
          echo "RUSTFLAGS=--remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$(rustc --print sysroot)=/rustc --remap-path-prefix=$root=/fringe $extra" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fringe-cli

      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          version="$(awk -F'"' '/^version *=/ { print $2; exit }' Cargo.toml)"
          if [[ "$GITHUB_EVENT_NAME" == release && "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "error: release tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
              exit 1
          fi
          exe=fringe-cli
          [[ "$RUNNER_OS" == Windows ]] && exe=fringe-cli.exe
          bin="target/${{ matrix.target }}/release/$exe"
          for p in "$HOME" "${USERPROFILE:-}" "$GITHUB_WORKSPACE"; do
              if [[ -n "$p" ]] && LC_ALL=C grep -a -q -F -- "$p" "$bin"; then
                  echo "error: $bin still contains the path $p" >&2
                  exit 1
              fi
          done

          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" dist
          cp "$bin" LICENSE-MIT LICENSE-APACHE "$stage/"
          # The committed THIRD-PARTY-LICENSES.txt lists the macOS crates; write this
          # platform's (no objc2; windows-sys on Windows).
          ${{ matrix.python }} scripts/third-party-licenses.py --target ${{ matrix.target }} --out "$stage/THIRD-PARTY-LICENSES.txt"
          "$stage/$exe" --version

          name="fringe-cli-$version-${{ matrix.target }}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == zip ]]; then
              (cd "$stage" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/$name" .)
          else
              tar -czf "dist/$name" -C "$stage" "$exe" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt
          fi
          # Write "<hash>  <name>" as shasum does on macOS: Git Bash's sha256sum marks
          # binary mode with "*<name>", which breaks lookups by file name.
          (cd dist && printf '%s  %s\n' "$(sha256sum "$name" | cut -d' ' -f1)" "$name" > "$name.sha256" && cat "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Upload the archives, then merge their checksums into the release's SHA256SUMS
      # (from scripts/release.sh, with the DMG and macOS tarball), replacing any lines
      # for the same files from an earlier run.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          shopt -s nullglob
          archives=(fringe-cli-*.tar.gz fringe-cli-*.zip)
          [[ ${#archives[@]} == 3 ]] || { echo "error: expected 3 archives, got: ${archives[*]}" >&2; exit 1; }
          gh release upload "$TAG" "${archives[@]}" --clobber
          gh release download "$TAG" --pattern SHA256SUMS --output existing 2>/dev/null || : > existing
          cat *.sha256 > new
          awk 'NR == FNR { skip[$2] = 1; next } !($2 in skip)' new existing > SHA256SUMS
          cat new >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
