[package]
name = "beam_core"
version = "0.2.0"
edition = "2021"

[lib]
name = "beam_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
faer = { version = "=0.24.4", default-features = false, features = ["std", "rayon", "sparse", "linalg"] }
spade = "=2.15.1"
ctrlc = "3"

[[bin]]
name = "beam-cli"
path = "src/bin/beam_cli.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
debug-assertions = true
