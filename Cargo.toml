[package]
name = "fringe_core"
version = "0.3.0"
edition = "2021"
description = "Full-wave 2D (Ez) optics solvers (FDTD, FEM, MoM) with a C ABI and a CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lprsrts/fringe"
publish = false
# The floor set by the dependencies (image 0.25); clippy's incompatible_msrv
# lint checks this crate's own code against it.
rust-version = "1.88"
# Binaries are listed below; a stray src/main.rs must not become a target.
autobins = false

[lib]
name = "fringe_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-complex = "0.4"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse", "linalg"] }
spade = "=2.15.1"
crc32fast = "1.5"

# Threads exist natively only: faer's rayon feature spawns std threads, and ctrlc
# (used by the CLI) has no wasm32 backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["rayon"] }
ctrlc = "3"

# wasm32-unknown-unknown has no clock behind std::time::Instant (it panics).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[[bin]]
name = "fringe-cli"
path = "src/bin/fringe_cli.rs"

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
debug-assertions = true
