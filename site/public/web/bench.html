<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fringe · bench</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b0d0f; color: #e8e6e1; font: 14px/1.6 ui-monospace, Menlo, monospace; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<p>Solves the lens example at preview quality with each solver, 3 times, in a fresh
Web Worker per solver, and logs the wall-clock times (also to the console as
<code>BENCH {...}</code>). <code>?scene=NAME</code> picks another example;
<code>?all</code> solves every example with its own solver instead.</p>
<pre id="out">running…</pre>
<script type="module">
const out = document.getElementById("out");
const params = new URLSearchParams(location.search);
const name = params.get("scene") ?? "lens";
out.textContent = `${navigator.userAgent}\n`;

async function bench(method, name) {
  const w = new Worker(new URL("./worker.js", import.meta.url), { type: "module" });
  let id = 0;
  const call = (op, ...args) => new Promise((resolve, reject) => {
    const my = id++;
    const h = ({ data }) => {
      if (data.id !== my) return;
      w.removeEventListener("message", h);
      data.ok ? resolve(data.value) : reject(new Error(data.error));
    };
    w.addEventListener("message", h);
    w.postMessage({ id: my, op, args });
  });
  const scene = await call("example", name);
  const times = [];
  let meta;
  for (let i = 0; i < 3; i++) {
    const t = performance.now();
    meta = await call("solve", scene, method, "preview");
    times.push(+((performance.now() - t) / 1000).toFixed(3));
  }
  w.terminate();
  return { scene: name, method: meta.method, grid: `${meta.nx}x${meta.ny}`, times_s: times, wasm_memory_mb: Math.round(meta.wasm_memory_mb) };
}

let runs = ["mom", "fdtd", "fem"].map((m) => [m, name]);
if (params.has("all")) {
  const { default: init, examples } = await import("./pkg/fringe_wasm.js");
  await init();
  runs = JSON.parse(examples()).map((e) => ["", e.name]);
}
for (const [m, n] of runs) {
  const r = await bench(m, n).catch((e) => ({ scene: n, method: m, error: e.message }));
  console.log(`BENCH ${JSON.stringify(r)}`);
  out.textContent += `${JSON.stringify(r)}\n`;
}
console.log("BENCH done");
out.textContent += "done\n";
</script>
</body>
</html>
