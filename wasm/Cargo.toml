# WebAssembly spike: fringe_core behind wasm-bindgen.
# Its own workspace, so the main crate's build and lockfile are untouched.
[package]
name = "fringe_wasm"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
fringe_core = { path = ".." }
wasm-bindgen = "=0.2.130"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Build scripts run on the host; skip stripping them, which needs llvm-tools
# (rust-objcopy) that a minimal rustup toolchain lacks.
[profile.release.build-override]
strip = false
