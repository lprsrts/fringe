<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fringe Web</title>
<meta name="description" content="Full-wave 2D optics in the browser: solve a scene with FDTD, MoM or FEM and share it as a link.">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="https://fringe.lprsrts.com" target="_blank" rel="noopener">fringe</a>
  <label>example
    <select id="example"><option value="">custom</option></select>
  </label>
  <label>solver
    <select id="method">
      <option value="">scene's</option>
      <option value="fdtd">FDTD</option>
      <option value="mom">MoM</option>
      <option value="fem">FEM (slow)</option>
    </select>
  </label>
  <label>show
    <select id="quantity">
      <option value="intensity">intensity</option>
      <option value="real">Re E</option>
      <option value="magnitude">|E|</option>
      <option value="phase">phase</option>
    </select>
  </label>
  <label>colors
    <select id="colormap">
      <option value="">auto</option>
      <option>inferno</option><option>viridis</option><option>plasma</option><option>turbo</option>
      <option>laser_glow</option><option>spectral_glow</option><option>asympton</option>
      <option>rdbu</option><option>twilight</option><option>phase_wheel</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="animate"> animate</label>
  <span class="grow"></span>
  <button id="solve" class="primary" title="Solve (⌘/Ctrl + Enter)">Solve</button>
  <button id="cancel" hidden>Cancel</button>
  <button id="share">Copy link</button>
  <button id="embed-btn">Embed</button>
  <button id="png">PNG</button>
</header>

<main>
  <div class="stage">
    <canvas id="field" width="960" height="540" aria-label="Solved field"></canvas>
    <div id="overlay" class="overlay">loading…</div>
    <a id="open-full" class="open-full" target="_blank" rel="noopener" hidden>open in Fringe ↗</a>
  </div>
  <p id="status" class="status" aria-live="polite"></p>
  <ul id="issues" class="issues"></ul>

  <details id="editor">
    <summary>scene JSON</summary>
    <textarea id="scene" spellcheck="false" autocomplete="off" aria-label="Scene JSON"></textarea>
    <p class="small">Edit and press Solve (⌘/Ctrl + Enter). The format is the one the app and
    <code>fringe-cli</code> read and write, so a scene can move between them.</p>
  </details>

  <dialog id="embed-dialog">
    <form method="dialog">
      <p>Paste this where the simulation should appear:</p>
      <textarea id="embed-code" readonly rows="4"></textarea>
      <div class="row">
        <button type="button" id="embed-copy" class="primary">Copy</button>
        <button value="close">Close</button>
      </div>
    </form>
  </dialog>
</main>

<script type="module" src="viewer.js"></script>
</body>
</html>
